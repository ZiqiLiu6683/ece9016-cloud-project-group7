apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
spec:
  [cite_start]replicas: 2 
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
      - name: webapp
        image: gcr.io/ece9016-cloudproject-group7/webapp:v1
        ports:
        - containerPort: 5005
        env:
        - name: DB_HOST
          value: "db-service"